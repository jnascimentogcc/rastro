[project]
name = "rastro-worker"
version = "0.0.0"
description = "Rastro background worker (Procrastinate)."
requires-python = ">=3.12"
dependencies = [
    "procrastinate[psycopg]>=2.0",
    "psycopg[binary,pool]>=3.2",
    "rastro-db",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rastro_worker"]
