services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rastro
      POSTGRES_PASSWORD: rastro
      POSTGRES_DB: rastro
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rastro -d rastro"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
