[project]
name = "rastro-code-analysis"
version = "0.0.0"
description = "Static analysis of TypeScript/JavaScript: symbols, normalized hashes, call graph."
requires-python = ">=3.12"
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-typescript>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rastro_code_analysis"]
