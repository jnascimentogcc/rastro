[project]
name = "rastro-session-parsers"
version = "0.1.0"
description = "Parsers that turn coding-agent session logs into commit-linked excerpts."
requires-python = ">=3.12"
dependencies = [
    "detect-secrets>=1.5.0",
]
# Placeholder until a license is chosen; replace before the first public release.
license = "LicenseRef-Proprietary"
authors = [{ name = "Rastro maintainers" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rastro_session_parsers"]
