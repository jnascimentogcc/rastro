[project]
name = "rastro-github"
version = "0.0.0"
description = "GitHub App integration: webhook signatures, API client protocol and githubkit adapter."
requires-python = ">=3.12"
dependencies = [
    "githubkit[auth-app]>=0.12",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rastro_github"]
