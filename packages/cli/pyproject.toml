[project]
name = "rastro-cli"
version = "0.0.0"
description = "Rastro command line: git hook capture of coding-agent sessions."
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "keyring>=25",
    "rastro-session-parsers",
]

[project.scripts]
rastro = "rastro_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rastro_cli"]
