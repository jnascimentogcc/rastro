[project]
name = "rastro-llm"
version = "0.0.0"
description = "LLM access behind a provider interface: structured extraction, embeddings, prompts."
requires-python = ">=3.12"
dependencies = [
    "openai>=1.60",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rastro_llm"]
