[project]
name = "rastro-mcp"
version = "0.1.0"
description = "Rastro MCP server: lets a coding agent look up the recorded business rules (read only)."
readme = "README.md"
requires-python = ">=3.12"
# Placeholder until a license is chosen; replace before the first public release.
license = "LicenseRef-Proprietary"
authors = [{ name = "Rastro maintainers" }]
keywords = ["mcp", "ai", "claude-code", "business-rules"]
dependencies = [
    "rastro-cli>=0.1.0,<0.2",
    "mcp>=2.3,<3",
]

[project.scripts]
rastro-mcp = "rastro_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rastro_mcp"]
